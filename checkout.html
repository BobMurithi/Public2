<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="shortcut icon" href="assets/images/bobsave-logo.svg" type="image/svg+xml">
  <title>Checkout - Bobsave</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme/css/bobsave-dark.css">
  <style>
    :root{--green:#9fe870;--green-dark:#264d0c;--dark:#232323;--dark-brown:#3a341c;--sage:#edefeb;--white:#fff;--muted:#5c6b57;--line:#e4e9df}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter Tight',sans-serif;color:var(--dark);background:var(--sage);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}
    .checkout-card{background:var(--white);border-radius:1.2rem;padding:2.5rem;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.08)}
    .checkout-card h1{font-size:1.6rem;font-weight:800;margin-bottom:.3rem}
    .checkout-card .subtitle{color:var(--muted);font-size:.95rem;margin-bottom:2rem}
    .form-group{margin-bottom:1.2rem}
    .form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem}
    .form-group input{width:100%;padding:.75rem 1rem;border:1.5px solid var(--line);border-radius:.75rem;font-size:.95rem;font-family:inherit;transition:border .2s}
    .form-group input:focus{outline:none;border-color:var(--green-dark)}
    .form-group .error{color:#d32f2f;font-size:.8rem;margin-top:.3rem;display:none}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .divider{height:1px;background:var(--line);margin:1.5rem 0}
    .btn{display:block;width:100%;padding:.85rem;border-radius:2rem;font-size:1rem;font-weight:700;text-align:center;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
    .btn-primary{background:var(--green);color:var(--green-dark)}
    .btn-primary:hover{background:#bcef9c}
    .btn-outline{background:transparent;border:2px solid var(--line);color:var(--dark);margin-top:.8rem;text-decoration:none}
    .btn-outline:hover{border-color:var(--dark)}
    .package-preview{background:var(--sage);border-radius:.75rem;padding:1.2rem;margin-bottom:1.5rem}
    .package-preview h3{font-size:1rem;font-weight:700}
    .package-preview .price{font-size:1.3rem;font-weight:800;color:var(--green-dark);margin-top:.3rem}
    .package-preview .price small{font-size:.8rem;font-weight:500;color:var(--muted)}
    .link-login{font-size:.85rem;color:var(--muted);text-align:center;margin-top:1.2rem}
    .link-login a{color:var(--green-dark);font-weight:600}
  </style>
</head>
<body>
  <div class="checkout-card">
    <h1>Create Your Account</h1>
    <p class="subtitle">Sign up to purchase your automation package</p>

    <div class="package-preview" id="packagePreview" style="display:none">
      <h3 id="pkgName"></h3>
      <div class="price" id="pkgPrice"></div>
    </div>

    <form id="signupForm" onsubmit="return handleSignup(event)">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" required placeholder="Jane">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" required placeholder="Mwangi">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="jane@clinic.co.ke">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" required placeholder="+254 7XX XXX XXX">
      </div>
      <div class="form-group">
        <label>Business Name</label>
        <input type="text" id="business" placeholder="e.g. Sunrise Clinic">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="8" placeholder="Min 8 characters">
      </div>

      <div class="divider"></div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Create Account &amp; Pay</button>
    </form>

    <p class="link-login">Already have an account? <a href="dashboard.html">Log in</a></p>
  </div>

  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script>
  var pendingPkg = JSON.parse(localStorage.getItem('bs_pending_package') || 'null');

  if (pendingPkg) {
    document.getElementById('packagePreview').style.display = 'block';
    document.getElementById('pkgName').textContent = pendingPkg.name || pendingPkg.id;
    document.getElementById('pkgPrice').innerHTML = pendingPkg.setupPrice
      ? '$' + pendingPkg.setupPrice + ' <small>setup</small> + $' + pendingPkg.monthlyPrice + '/mo'
      : 'Custom pricing';
  }

  function handleSignup(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.textContent = 'Processing...';
    btn.disabled = true;

    var userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
    var user = {
      id: userId,
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      business: document.getElementById('business').value,
      createdAt: new Date().toISOString(),
      packages: [],
      automations: []
    };

    localStorage.setItem('bs_user', JSON.stringify(user));

    if (pendingPkg) {
      var amount = pendingPkg.setupPrice || 100;
      var handler = PaystackPop.setup({
        key: 'pk_test_3dcb96f3bb37fc6815fb2aa2997147c85dd936fb',
        email: user.email,
        amount: amount * 100,
        currency: 'USD',
        metadata: {
          custom_fields: [
            { display_name: 'Package', variable_name: 'package', value: pendingPkg.id },
            { display_name: 'Niche', variable_name: 'niche', value: pendingPkg.nicheId || '' },
            { display_name: 'Industry', variable_name: 'industry', value: pendingPkg.industryId || '' },
            { display_name: 'User ID', variable_name: 'user_id', value: userId },
            { display_name: 'Business', variable_name: 'business', value: user.business }
          ]
        },
        callback: function(response) {
          localStorage.setItem('bs_last_payment', JSON.stringify({
            reference: response.reference,
            package: pendingPkg.id,
            amount: amount,
            date: new Date().toISOString()
          }));

          user.packages.push({
            id: pendingPkg.id,
            industryId: pendingPkg.industryId,
            nicheId: pendingPkg.nicheId,
            status: 'active',
            purchasedAt: new Date().toISOString()
          });
          localStorage.setItem('bs_user', JSON.stringify(user));
          localStorage.removeItem('bs_pending_package');

          window.location.href = 'payment-success.html?ref=' + response.reference;
        },
        onClose: function() {
          btn.textContent = 'Create Account & Pay';
          btn.disabled = false;
        }
      });
      handler.openIframe();
    } else {
      window.location.href = 'dashboard.html';
    }
    return false;
  }
  </script>
</body>
</html>
