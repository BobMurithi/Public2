<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <!-- Gradient for the icon node circles -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9fe870;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0e2e1;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for the shield/save icon -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a341c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232323;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ── ICON: workflow nodes inside a rounded square ── -->
  <!-- Outer rounded square background -->
  <rect x="2" y="2" width="56" height="56" rx="14" ry="14" fill="url(#shieldGrad)" />

  <!-- Workflow connector lines -->
  <line x1="16" y1="30" x2="44" y2="30" stroke="#9fe870" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="30" y1="16" x2="30" y2="44" stroke="#a0e2e1" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="16" y1="16" x2="44" y2="44" stroke="#ffea64" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="44" y1="16" x2="16" y2="44" stroke="#ffd7ef" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Centre node — primary green -->
  <circle cx="30" cy="30" r="7" fill="#9fe870"/>
  <!-- Top node — teal -->
  <circle cx="30" cy="14" r="4" fill="#a0e2e1"/>
  <!-- Bottom node — yellow -->
  <circle cx="30" cy="46" r="4" fill="#ffea64"/>
  <!-- Left node — pink -->
  <circle cx="14" cy="30" r="4" fill="#ffd7ef"/>
  <!-- Right node — green lighter -->
  <circle cx="46" cy="30" r="4" fill="#bcef9c"/>

  <!-- Lightning bolt inside centre node (automation signal) -->
  <path d="M31.5 26.5 L28.5 30.5 L31 30.5 L28.5 33.5 L32 29.5 L29.5 29.5 Z"
        fill="#3a341c" stroke="none"/>

  <!-- ── WORDMARK ── -->
  <!-- "Bob" in bold dark -->
  <text x="68" y="37"
        font-family="'Inter Tight', 'Segoe UI', sans-serif"
        font-size="24"
        font-weight="700"
        fill="#232323"
        letter-spacing="-0.5">Bob</text>

  <!-- "save" in primary green, slightly lighter weight -->
  <text x="108" y="37"
        font-family="'Inter Tight', 'Segoe UI', sans-serif"
        font-size="24"
        font-weight="700"
        fill="#9fe870"
        letter-spacing="-0.5">save</text>

  <!-- Tagline under wordmark -->
  <text x="68" y="51"
        font-family="'Inter Tight', 'Segoe UI', sans-serif"
        font-size="9"
        font-weight="400"
        fill="#757b62"
        letter-spacing="1.5">WORKFLOW AUTOMATION</text>
</svg>
